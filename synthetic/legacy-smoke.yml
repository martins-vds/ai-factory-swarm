# Builds and smoke-tests the legacy Lending Library (ADR-0037 synthetic target). Not generated by the harness.
name: Legacy smoke test
on:
  push:
    paths: [legacy/**, .github/workflows/legacy-smoke.yml]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Build, start, probe
        working-directory: legacy
        run: |
          mvn -q -B package -DskipTests
          (PORT=8080 java -cp "target/classes:target/dependency/*" lib.App > app.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf localhost:8080/loans >/dev/null && break; sleep 1; done
          curl -sf localhost:8080/loans
          curl -sf localhost:8080/fees/L3 | grep -q 'Fee: \$4.75'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8080/payments/L3)" = 502
          curl -sf localhost:8080/about | grep -q 'Lending Library'
          curl -sf -X POST -d member=dee -d isbn=123 localhost:8080/loans
          echo "legacy smoke test passed"
