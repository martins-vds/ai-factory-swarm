# Generated by AI Factory Swarm bootstrap (harness {harness_version}, {harness_commit_short}). Do not edit by hand.
# afs-coverage: no-verdict (reports or prepares; it has no failing verdict to drill, ADR-0027)
# ADR-0029: a ticket that closes as completed while an open PR into the default branch still says it fixes it
# is reopened, with a comment naming that PR. Merging a Verifier PR into a work branch (a stacked merge) closes
# the work ticket too early otherwise, and a closed ticket lifts its blockers and counts as done.
name: AFS ticket guard

on:
  issues:
    types: [closed]

jobs:
  guard:
    if: ${{{{ !github.event.issue.pull_request && github.event.issue.state_reason == 'completed' }}}}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Reopen a ticket whose work isn't on the default branch yet
        env:
          GH_TOKEN: ${{{{ github.token }}}}
        run: python3 .migration/harness/tools/ticket_guard.py --repo "${{{{ github.repository }}}}" --issue "${{{{ github.event.issue.number }}}}"
