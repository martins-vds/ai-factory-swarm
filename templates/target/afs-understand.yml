# Generated by AI Factory Swarm bootstrap (harness {harness_version}, {harness_commit_short}). Do not edit by hand.
# Phase 2 (ADR-0009): build the source graphs with Understand Anything through the Copilot SDK and propose
# them as a PR. Billed to Copilot premium requests: a slice costs tens of requests, the whole source many more.
name: AFS understand (source graphs)

on:
  workflow_dispatch:
    inputs:
      slice:
        description: "Slice spec name in .migration/slices/ (e.g. currency); empty = the whole source"
        required: false
        default: ""
      model:
        description: "Model override (empty = Copilot default)"
        required: false
        default: ""

jobs:
  understand:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      pull-requests: write
      copilot-requests: write
    env:
      SCOPE: ${{{{ inputs.slice || 'full' }}}}
      AFS_GRAPH_MODEL: ${{{{ inputs.model }}}}
      GITHUB_TOKEN: ${{{{ github.token }}}}   # the SDK authenticates with it (copilot-requests: write)
    steps:
      - uses: actions/checkout@v5
      - name: Read pinned source from .migration/source.lock
        id: lock
        run: |
          for k in repo sha path; do echo "$k=$(awk -v k="$k:" '$1==k{{print $2}}' .migration/source.lock)" >> "$GITHUB_OUTPUT"; done
      - name: Check out source (read-only, pinned)
        uses: actions/checkout@v5
        with:
          repository: ${{{{ steps.lock.outputs.repo }}}}
          ref: ${{{{ steps.lock.outputs.sha }}}}
          token: ${{{{ secrets.SOURCE_READ_TOKEN || github.token }}}}   # public sources need no secret
          path: .source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {{ node-version: "22" }}
      - uses: actions/setup-python@v5
        with: {{ python-version: "{python_version}" }}
      - name: Install Copilot CLI {copilot_cli_version}, SDK {copilot_sdk_version}, Understand Anything ({ua_commit_short})
        run: |
          npm install -g pnpm @github/copilot@{copilot_cli_version} > /dev/null
          pip install -q github-copilot-sdk=={copilot_sdk_version} {pip_packages}
          python -m copilot download-runtime > /dev/null
          ua="$RUNNER_TEMP/understand-anything"
          git init -q "$ua"
          git -C "$ua" fetch -q --depth 1 https://github.com/{ua_repo} {ua_commit}
          git -C "$ua" checkout -q FETCH_HEAD
{ua_patch_steps}
      - name: Prepare the folder to analyze
        run: |
          d="$RUNNER_TEMP/analyze"
          if [ "$SCOPE" = full ]; then
            # git archive: the tracked files only, without the source's .git (a copied .git leaves nothing to commit)
            p="${{{{ steps.lock.outputs.path }}}}"
            mkdir -p "$d" && git -C .source archive HEAD -- "${{p:-.}}" | tar -x -C "$d"
          else
            python .migration/harness/tools/extract_slice.py --root .source --spec ".migration/slices/$SCOPE.yaml" --out "$d"
          fi
          git -C "$d" init -q && git -C "$d" add -A && git -C "$d" -c user.name=afs -c user.email=afs@local commit -qm "$SCOPE at ${{{{ steps.lock.outputs.sha }}}}"
      - name: Run /understand and /understand-domain
        id: run
        run: |
          out=".migration/graphs/source/$SCOPE"
          set -o pipefail
          python .migration/harness/tools/understand.py --dir "$RUNNER_TEMP/analyze" \
            --plugin "$RUNNER_TEMP/understand-anything" --out "$out" 2>&1 | tee "$RUNNER_TEMP/understand.log"
          mkdir -p "$RUNNER_TEMP/events" && mv "$out"/events-*.jsonl "$out"/error-*.txt "$RUNNER_TEMP/events/" 2>/dev/null || true
          [ -f "$RUNNER_TEMP/analyze/MANIFEST.txt" ] && cp "$RUNNER_TEMP/analyze/MANIFEST.txt" "$out/"
          anchors=$(python -c "import yaml,sys;s=yaml.safe_load(open(sys.argv[1])) if sys.argv[1]!='full' else {{}};print(' '.join('--anchor '+x for x in s.get('anchors',[])))" \
            "$([ "$SCOPE" = full ] && echo full || echo .migration/slices/$SCOPE.yaml)")
          dom=""; [ -f "$out/domain-graph.json" ] && dom="--domain $out/domain-graph.json"
          python .migration/harness/tools/check_graph.py "$out/knowledge-graph.json" $dom $anchors > "$out/graph-check.md"
          {{ echo "source: ${{{{ steps.lock.outputs.repo }}}}@${{{{ steps.lock.outputs.sha }}}}"; echo "scope: $SCOPE"; \
            echo "understand_anything: {ua_commit}"; echo "run: ${{{{ github.server_url }}}}/${{{{ github.repository }}}}/actions/runs/${{{{ github.run_id }}}}"; }} > "$out/SNAPSHOT.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {{ name: understand-events, path: "${{{{ runner.temp }}}}/events", if-no-files-found: ignore }}
      # On failure, push the log on a branch (no PR) so the operator can read it without Actions log access.
      - name: Push the failure log
        if: failure() && steps.run.outcome == 'failure'
        run: |
          b="afs/graph-$SCOPE-${{{{ github.run_id }}}}-failed"
          out=".migration/graphs/source/$SCOPE"
          mkdir -p "$out" && cp "$RUNNER_TEMP/understand.log" "$out/understand.log"
          cp "$RUNNER_TEMP"/events/error-*.txt "$out/" 2>/dev/null || true
          git switch -c "$b" && git add -f "$out"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Failed graph run $SCOPE (log only; do not merge)"
          git push -q origin "$b"
          echo "::error::Graph run failed; log pushed to branch $b"
      - name: Propose the graphs as a PR
        env:
          GH_TOKEN: ${{{{ github.token }}}}
        run: |
          b="afs/graph-$SCOPE-${{{{ github.run_id }}}}"
          git switch -c "$b"
          git add ".migration/graphs/source/$SCOPE"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Source graphs: $SCOPE at ${{{{ steps.lock.outputs.sha }}}}"
          git push -q origin "$b"
          gh pr create --base "${{{{ github.ref_name }}}}" --head "$b" --title "Source graphs: $SCOPE" \
            --body-file ".migration/graphs/source/$SCOPE/graph-check.md" \
            || echo "::notice::Branch $b pushed; open the PR by hand (Actions may not be allowed to create PRs)."
