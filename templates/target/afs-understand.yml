# Generated by AI Factory Swarm bootstrap (harness {harness_version}, {harness_commit_short}). Do not edit by hand.
# Build a code graph with Understand Anything through the Copilot SDK and propose it as a PR (ADR-0009).
# side=source: the pinned source (Phase 2; rebuilt automatically when .migration/source.lock changes on main).
# side=target: the target's profile graph.target_paths at this commit; needed fresh for slice acceptance.
# Each graph records what it describes (SNAPSHOT.txt, project.gitCommitHash) so check_graph_fresh.py can
# tell, deterministically, whether it is stale (ADR-0019). Billed to Copilot premium requests.
# Run it on main: a workflow token can't push a branch whose history changes workflow files not yet on main.
name: AFS understand (code graphs)

on:
  push:
    branches: [main]
    paths: [.migration/source.lock]
  workflow_dispatch:
    inputs:
      side:
        description: "source (the pinned legacy code) or target (this repo's code)"
        type: choice
        options: [source, target]
        default: source
      slice:
        description: "Source only: slice spec name in .migration/slices/ (e.g. currency); empty = the whole source"
        required: false
        default: ""
      model:
        description: "Model override (empty = Copilot default)"
        required: false
        default: ""
      domain_entry_points:
        description: "Optional source-relative entry-point file paths, one per line; each must have a verified domain flow"
        required: false
        default: ""

jobs:
  understand:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      pull-requests: write
      copilot-requests: write
    env:
      SIDE: ${{{{ inputs.side || 'source' }}}}
      SCOPE: ${{{{ (inputs.side == 'target' || !inputs.slice) && 'full' || inputs.slice }}}}
      AFS_GRAPH_MODEL: ${{{{ inputs.model }}}}
      AFS_DOMAIN_ENTRY_POINTS: ${{{{ inputs.domain_entry_points }}}}
      GITHUB_TOKEN: ${{{{ github.token }}}}   # the SDK authenticates with it (copilot-requests: write)
    steps:
      - uses: actions/checkout@v5
      - name: Read pinned source from .migration/source.lock
        id: lock
        run: |
          for k in repo sha path; do echo "$k=$(awk -v k="$k:" '$1==k{{print $2}}' .migration/source.lock)" >> "$GITHUB_OUTPUT"; done
      - name: Check out source (read-only, pinned)
        uses: actions/checkout@v5
        with:
          repository: ${{{{ steps.lock.outputs.repo }}}}
          ref: ${{{{ steps.lock.outputs.sha }}}}
          token: ${{{{ secrets.SOURCE_READ_TOKEN || github.token }}}}   # public sources need no secret
          path: .source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {{ node-version: "22" }}
      # ADR-0025: Graphify (the language-level layer) in its own Python 3.12 venv, every package hash-pinned
      # (.migration/harness/tools/locks/graphify.lock). Set up before the job's Python, which takes PATH after it.
      - uses: actions/setup-python@v5
        id: graphify-python
        with: {{ python-version: "3.12" }}
      - name: Install Graphify (hash-pinned)
        run: |
          "${{{{ steps.graphify-python.outputs.python-path }}}}" -m venv "$RUNNER_TEMP/graphify-venv"
          "$RUNNER_TEMP/graphify-venv/bin/pip" install -q --require-hashes --no-deps \
            -r .migration/harness/tools/locks/graphify.lock
      - uses: actions/setup-python@v5
        with: {{ python-version: "{python_version}" }}
      - name: Install Copilot CLI {copilot_cli_version}, SDK {copilot_sdk_version}, Understand Anything ({ua_commit_short})
        run: |
          npm install -g pnpm @github/copilot@{copilot_cli_version} > /dev/null
          pip install -q github-copilot-sdk=={copilot_sdk_version} {pip_packages}
          python -m copilot download-runtime > /dev/null
          ua="$RUNNER_TEMP/understand-anything"
          git init -q "$ua"
          git -C "$ua" fetch -q --depth 1 https://github.com/{ua_repo} {ua_commit}
          git -C "$ua" checkout -q FETCH_HEAD
{ua_patch_steps}
      - name: Prepare the folder to analyze
        run: |
          d="$RUNNER_TEMP/analyze"
          if [ "$SIDE" = target ]; then
            # The target's code at this commit: profile graph.target_paths (default src), without tests.
            paths=$(python -c "import yaml;g=(yaml.safe_load(open('.migration/profile.yaml')).get('graph') or {{}});print(' '.join(g.get('target_paths') or ['src']))")
            echo "$paths" > "$RUNNER_TEMP/target_paths"
            mkdir -p "$d" && git archive HEAD -- $paths | tar -x -C "$d"
          elif [ "$SCOPE" = full ]; then
            # git archive: the tracked files only, without the source's .git (a copied .git leaves nothing to commit)
            p="${{{{ steps.lock.outputs.path }}}}"
            mkdir -p "$d" && git -C .source archive HEAD -- "${{p:-.}}" | tar -x -C "$d"
          else
            python .migration/harness/tools/extract_slice.py --root .source --spec ".migration/slices/$SCOPE.yaml" --out "$d"
          fi
          git -C "$d" init -q && git -C "$d" add -A && git -C "$d" -c user.name=afs -c user.email=afs@local commit -qm "$SIDE $SCOPE"
      - name: Run /understand and /understand-domain
        id: run
        run: |
          out=".migration/graphs/$SIDE/$SCOPE"
          domain_args=()
          coverage_args=()
          while IFS= read -r entry || [ -n "$entry" ]; do
            [ -n "$entry" ] || continue
            domain_args+=(--domain-entry-point "$entry")
          done <<< "$AFS_DOMAIN_ENTRY_POINTS"
          if [ "${{#domain_args[@]}}" -gt 0 ]; then
            coverage_args+=(--defer-domain-coverage)
          fi
          set -o pipefail
          python .migration/harness/tools/understand.py --dir "$RUNNER_TEMP/analyze" \
            --plugin "$RUNNER_TEMP/understand-anything" --out "$out" \
            "${{domain_args[@]}}" "${{coverage_args[@]}}" \
            2>&1 | tee "$RUNNER_TEMP/understand.log"
          mkdir -p "$RUNNER_TEMP/events" && mv "$out"/events-*.jsonl "$out"/error-*.txt "$RUNNER_TEMP/events/" 2>/dev/null || true
          [ -f "$RUNNER_TEMP/analyze/MANIFEST.txt" ] && cp "$RUNNER_TEMP/analyze/MANIFEST.txt" "$out/"
          [ "$SIDE" = target ] && anchors="" || anchors=$(python -c "import yaml,sys;s=yaml.safe_load(open(sys.argv[1])) if sys.argv[1]!='full' else {{}};print(' '.join('--anchor '+x for x in s.get('anchors',[])))" \
            "$([ "$SCOPE" = full ] && echo full || echo .migration/slices/$SCOPE.yaml)")
          dom=""; [ -f "$out/domain-graph.json" ] && dom="--domain $out/domain-graph.json"
          # Enrichment, two layers. ADR-0025: Graphify's deterministic language-level structure (calls, uses,
          # implements, inherits), extracted from a copy of the analysed folder so its output isn't analysed.
          # ADR-0020: the profile's framework enrichers (ORM tables, reads/writes, endpoints, pages, routes, …).
          gf="$RUNNER_TEMP/graphify-in"; rm -rf "$gf"; cp -r "$RUNNER_TEMP/analyze" "$gf"; rm -rf "$gf/.git"
          ( cd "$gf" && GRAPHIFY_BACKEND=none "$RUNNER_TEMP/graphify-venv/bin/graphify" extract . --code-only ) > "$RUNNER_TEMP/graphify.log" 2>&1 \
            || {{ tail -40 "$RUNNER_TEMP/graphify.log"; echo "::error::Graphify failed (ADR-0025)"; exit 1; }}
          enrichers=$(python -c "import yaml,sys;g=yaml.safe_load(open('.migration/profile.yaml')).get('graph') or {{}};print(' '.join('--enricher '+e for e in (g.get('enrich') or {{}}).get(sys.argv[1]) or []))" "$SIDE")
          [ -n "$enrichers" ] || echo "::warning::No graph.enrich.$SIDE in the profile: no framework links (routes, data access) beyond what Understand Anything infers (ADR-0020)."
          python .migration/harness/tools/enrich_graph.py "$out/knowledge-graph.json" --root "$RUNNER_TEMP/analyze" \
            --graphify "$gf/graphify-out/graph.json" $enrichers
          # Identity (ADR-0019): what this graph describes, replacing the throwaway commit id in the JSONs.
          if [ "$SIDE" = source ]; then id="${{{{ steps.lock.outputs.sha }}}}"; else id="${{{{ github.sha }}}}"; fi
          echo "AFS_GRAPH_ID=$id" >> "$GITHUB_ENV"
          python - "$out" "$id" <<'PY'
          import json, pathlib, sys
          out, ident = pathlib.Path(sys.argv[1]), sys.argv[2]
          for name in ("knowledge-graph.json", "domain-graph.json"):
              p = out / name
              if p.is_file():
                  g = json.loads(p.read_text(encoding="utf-8"))
                  proj = g.setdefault("project", {{}})
                  proj["analyzedCommit"] = proj.get("gitCommitHash")
                  proj["gitCommitHash"] = ident
                  p.write_text(json.dumps(g, indent=2) + "\n", encoding="utf-8")
          PY
          if [ "${{#domain_args[@]}}" -gt 0 ]; then
            python .migration/harness/tools/check_domain_coverage.py \
              --root "$RUNNER_TEMP/analyze" --knowledge "$out/knowledge-graph.json" \
              --domain "$out/domain-graph.json" "${{domain_args[@]}}"
          fi
          {{ echo "side: $SIDE"; echo "scope: $SCOPE"
            if [ "$SIDE" = source ]; then
              echo "source: ${{{{ steps.lock.outputs.repo }}}}@${{{{ steps.lock.outputs.sha }}}}"; echo "source_sha: ${{{{ steps.lock.outputs.sha }}}}"
            else
              echo "target_commit: ${{{{ github.sha }}}}"
              for p in $(cat "$RUNNER_TEMP/target_paths"); do echo "tree.$p: $(git rev-parse HEAD:$p)"; done
            fi
            echo "understand_anything: {ua_commit}"; echo "run: ${{{{ github.server_url }}}}/${{{{ github.repository }}}}/actions/runs/${{{{ github.run_id }}}}"; }} > "$out/SNAPSHOT.txt"
          {{ echo "> $(grep -E '^(source|target_commit|tree\.)' "$out/SNAPSHOT.txt" | tr '\n' ' ')"; echo; \
            if [ "$SCOPE" = full ]; then python .migration/harness/tools/graph_gate.py --side "$SIDE" || true; echo; fi; \
            python .migration/harness/tools/check_graph.py "$out/knowledge-graph.json" $dom $anchors; }} > "$out/graph-check.md"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {{ name: understand-events, path: "${{{{ runner.temp }}}}/events", if-no-files-found: ignore }}
      # On failure, push the log on a branch (no PR) so the operator can read it without Actions log access.
      - name: Push the failure log
        if: failure() && steps.run.outcome == 'failure'
        run: |
          b="afs/graph-$SIDE-$SCOPE-${{{{ github.run_id }}}}-failed"
          out=".migration/graphs/$SIDE/$SCOPE"
          mkdir -p "$out" && cp "$RUNNER_TEMP/understand.log" "$out/understand.log"
          cp "$RUNNER_TEMP"/events/error-*.txt "$out/" 2>/dev/null || true
          git switch -c "$b" && git add -f "$out"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Failed graph run $SIDE $SCOPE (log only; do not merge)"
          git push -q origin "$b"
          echo "::error::Graph run failed; log pushed to branch $b"
      - name: Propose the graphs as a PR
        env:
          GH_TOKEN: ${{{{ github.token }}}}
        run: |
          b="afs/graph-$SIDE-$SCOPE-${{{{ github.run_id }}}}"
          git switch -c "$b"
          git add ".migration/graphs/$SIDE/$SCOPE"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Code graph: $SIDE $SCOPE at $AFS_GRAPH_ID"
          git push -q origin "$b"
          gh pr create --base "${{{{ github.ref_name }}}}" --head "$b" --title "Code graph: $SIDE $SCOPE" \
            --body-file ".migration/graphs/$SIDE/$SCOPE/graph-check.md" \
            || echo "::notice::Branch $b pushed; open the PR by hand (Actions may not be allowed to create PRs)."
          # Only after the graph is safely on a branch: it must check as fresh (ADR-0019). This graph alone;
          # other graphs on the base are not this run's business. A failure leaves the PR to inspect.
          python .migration/harness/tools/check_graph_fresh.py --only ".migration/graphs/$SIDE/$SCOPE"
          # ADR-0020: the graph must have the profile's required types and reach data from every slice anchor.
          if [ "$SCOPE" = full ]; then python .migration/harness/tools/graph_gate.py --side "$SIDE" > /dev/null; fi
