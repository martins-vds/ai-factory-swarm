# Generated by AI Factory Swarm bootstrap (harness {harness_version}, {harness_commit_short}). Do not edit by hand.
# ADR-0038: when the default branch moves, merge it into every open stacked PR, bottom-up, so
# check_stack_base.py never has to fail them and nobody has to refresh stacks by hand. Pushes need
# AFS_STACK_TOKEN (contents: write, pull requests: write): a push made with the workflow's own token
# starts no CI, and a refreshed PR whose checks never re-run is worse than a stale one.
name: AFS stack refresh

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: afs-stack-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require the push token
        env:
          HAS_TOKEN: ${{{{ secrets.AFS_STACK_TOKEN != '' }}}}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error title=AFS_STACK_TOKEN missing::Add a repository secret AFS_STACK_TOKEN (fine-grained token, this repo, Contents and Pull requests: read and write). Without it, refreshed PRs would get no new CI run (ADR-0038)."
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{{{ secrets.AFS_STACK_TOKEN }}}}
      - name: Refresh stacked PRs bottom-up
        env:
          GH_TOKEN: ${{{{ secrets.AFS_STACK_TOKEN }}}}
        run: |
          set -o pipefail
          python3 .migration/harness/tools/stack_refresh.py --repo "${{{{ github.repository }}}}" --comment | tee -a "$GITHUB_STEP_SUMMARY"
