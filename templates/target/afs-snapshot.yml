# Generated by AI Factory Swarm bootstrap (harness {harness_version}, {harness_commit_short}). Do not edit by hand.
# ADR-0032: a snapshot of the legacy database, made by the profile's data.snapshot commands and kept as a
# workflow artifact, never in git. Dispatching this workflow is the snapshot owner's act: agents never make a
# snapshot; Copilot setup steps fetch the newest one for data tickets. The artifact is as visible as this repo's
# Actions artifacts: for real production data use a private repo, and masking (profile data.masking).
name: AFS data snapshot

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this snapshot (e.g. first rehearsal, refresh before cutover)"
        required: true
        type: string

jobs:
  snapshot:
    name: Export, describe and check the snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Read pinned source from .migration/source.lock
        id: lock
        run: |
          echo "repo=$(awk '/^repo:/{{print $2}}' .migration/source.lock)" >> "$GITHUB_OUTPUT"
          echo "sha=$(awk '/^sha:/{{print $2}}' .migration/source.lock)" >> "$GITHUB_OUTPUT"
      - name: Check out source (read-only, pinned)
        uses: actions/checkout@v5
        with:
          repository: ${{{{ steps.lock.outputs.repo }}}}
          ref: ${{{{ steps.lock.outputs.sha }}}}
          token: ${{{{ secrets.SOURCE_READ_TOKEN || github.token }}}}
          path: .source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {{ python-version: "{python_version}" }}
      - run: pip install -q pyyaml
      - name: Read the snapshot settings from the profile
        id: data
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import yaml
          d = (yaml.safe_load(open(".migration/profile.yaml")) or {{}}).get("data") or {{}}
          if not d.get("snapshot"):
              raise SystemExit("::error::the profile defines no data.snapshot commands (ADR-0032)")
          print(f"java={{d.get('snapshot_java') or ''}}")
          PY
      - name: Java for the legacy runtime and the exporter
        if: steps.data.outputs.java != ''
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{{{ steps.data.outputs.java }}}}
      - name: Make the snapshot (profile data.snapshot)
        env:
          AFS_SNAPSHOT_REASON: ${{{{ inputs.reason }}}}
        run: |
          out="$RUNNER_TEMP/afs-snapshot"
          python - "$out" <<'PY'
          import subprocess, sys, yaml
          out = sys.argv[1]
          cmds = (yaml.safe_load(open(".migration/profile.yaml"))["data"])["snapshot"]
          for cmd in cmds:
              cmd = cmd.replace("{{out}}", out)
              print(f"$ {{cmd}}", flush=True)
              subprocess.run(["bash", "-euo", "pipefail", "-c", cmd], check=True)
          PY
          python .migration/harness/tools/data_reconcile.py snapshot "$out"
          echo "AFS_SNAPSHOT_DIR=$out" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: afs-snapshot
          path: ${{{{ env.AFS_SNAPSHOT_DIR }}}}
          retention-days: 30
          if-no-files-found: error
