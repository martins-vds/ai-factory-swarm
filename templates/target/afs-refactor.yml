# Generated by AI Factory Swarm bootstrap (harness {harness_version}, {harness_commit_short}). Do not edit by hand.
# afs-coverage: no-verdict (reports or prepares; it has no failing verdict to drill, ADR-0027)
# ADR-0072: once a month, plan a behaviour-preserving refactor of the slice that has gone longest without one, and
# propose it as a PR. The operator merges it and the dispatcher publishes the ticket; the existing tests it had to
# change are the slice's coupling measurement (afs-dashboard health).
name: AFS refactor

on:
  schedule:
    - cron: "23 7 1 * *"
  workflow_dispatch:
    inputs:
      slice:
        description: "Slice to refactor; empty = the one that has gone longest without a refactor"
        required: false
        default: ""

jobs:
  refactor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: {{ python-version: "{python_version}" }}
      - run: pip install -q pyyaml
      - name: Plan the refactor ticket
        run: |
          s="${{{{ inputs.slice }}}}"
          python .migration/harness/tools/afs-refactor-ticket propose --write --issue-out "$RUNNER_TEMP/issue.md" \
            ${{s:+--slice "$s"}} | tee "$RUNNER_TEMP/out.txt"
      - name: Propose as a PR
        env:
          GH_TOKEN: ${{{{ github.token }}}}
        run: |
          [ -n "$(git status --porcelain -- .migration/plan)" ] || {{ echo "No refactor to plan."; exit 0; }}
          id=$(sed -n 's/.*ticket=\(REF-[A-Z0-9-]*\).*/\1/p' "$RUNNER_TEMP/out.txt")
          b="afs/refactor-$id"
          git switch -c "$b" && git add .migration/plan
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Plan $id: a periodic refactor (ADR-0072)"
          git push -q origin "$b"
          {{ echo "Plans **$id**, a periodic behaviour-preserving refactor (ADR-0072). After merging, publish it as an issue and dispatch it like any Migrator ticket. The issue text:"; echo; echo '---'; echo; cat "$RUNNER_TEMP/issue.md"; }} > "$RUNNER_TEMP/body.md"
          gh pr create --base "${{{{ github.event.repository.default_branch }}}}" --head "$b" \
            --title "Plan $id: periodic refactor" --body-file "$RUNNER_TEMP/body.md"
