# Generated by AI Factory Swarm bootstrap (harness {harness_version}, {harness_commit_short}). Do not edit by hand.
# afs-coverage: no-verdict (reports or prepares; it has no failing verdict to drill, ADR-0027)
# ADR-0070: a test that failed and then passed on the same code becomes a ticket, not a silent retry. Reads the
# flaky records agent sessions commit (.migration/evidence/flaky/) and the CI runs re-run on the same commit,
# and opens or updates one `afs-flaky` issue per test.
name: AFS flaky tests

on:
  push:
    branches: [main]
    paths: [".migration/evidence/flaky/**"]
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

jobs:
  flaky:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: {{ python-version: "{python_version}" }}
      - name: Open or update a ticket per flaky test
        env:
          GH_TOKEN: ${{{{ github.token }}}}
        run: python .migration/harness/tools/afs-flaky tickets --repo "${{{{ github.repository }}}}" --days 7
