# Generated by AI Factory Swarm bootstrap (harness {harness_version}, {harness_commit_short}). Do not edit by hand.
# Checks on every PR: agent PRs commit their return file, migration state is valid, harness files are unchanged, the RTK block and hook are
# what the pinned RTK writes (ADR-0015), and — once target code exists — the build, idiom and test gates.
name: AFS harness check

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness:
    name: Migration state and pinned harness files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: {{ fetch-depth: 0 }}   # check_graph_fresh compares tree hashes and finds acceptance returns
      - uses: actions/setup-python@v5
        with: {{ python-version: "{python_version}" }}
      - run: pip install -q {pip_packages}
      - name: Migration state is valid
        run: python .migration/harness/tools/validate.py .migration
      - name: Session records are append-only
        if: github.event_name == 'pull_request'
        run: |
          # ADR-0021: the session hook commits one record per agent session. A PR may add records, never
          # change or delete one: they are the only trace of what sessions cost and which tools they ran.
          changed=$(git diff --name-only --diff-filter=DMR "origin/${{{{ github.base_ref }}}}...HEAD" -- .migration/costs/)
          if [ -n "$changed" ]; then
            for f in $changed; do echo "::error file=$f::A session record was changed or deleted; records are append-only (ADR-0021)"; done
            exit 1
          fi
      - name: No unopened quirk drafts
        run: |
          # Quirk drafts are an outbox: the orchestrator opens each as an issue, links it in the ledger and
          # removes the file. A PR that still carries drafts is not ready to merge.
          if ls .migration/quirks/*.md >/dev/null 2>&1; then
            for f in .migration/quirks/*.md; do echo "::error file=$f::Quirk draft not yet opened as an issue: $f"; done
            exit 1
          fi
      - name: Compose file defines the profile's test services, each with a healthcheck
        run: python .migration/harness/tools/afs-services lint
      # ADR-0019: a stale source graph always fails; an acceptance (auditor verdict: complete) also needs a
      # target graph built from this code. Otherwise a stale target graph is only a warning.
      - name: Code graphs describe the code they claim to
        run: python .migration/harness/tools/check_graph_fresh.py ${{{{ github.event_name == 'pull_request' && format('--acceptance-since origin/{{0}}', github.base_ref) || '' }}}}
      # ADR-0020: the source graph has the profile's required types and every slice's source anchors reach
      # data; the target graph is held to the same at acceptance.
      - name: Code graphs reach the data
        run: |
          python .migration/harness/tools/graph_gate.py --side source > /dev/null
          if [ "${{{{ github.event_name }}}}" = pull_request ]; then
            python .migration/harness/tools/graph_gate.py --side target --acceptance-since "origin/${{{{ github.base_ref }}}}" > /dev/null
          fi
      - name: Harness files are unchanged
        run: python .migration/harness/tools/check_installed.py
      - name: RTK block and hook match RTK {rtk_version}
        env:
          GH_TOKEN: ${{{{ github.token }}}}
        run: |
          d=$(mktemp -d)
          gh release download "v{rtk_version}" --repo {rtk_repo} --pattern "{rtk_asset}" --dir "$d"
          tar -xzf "$d/{rtk_asset}" -C "$d"
          rtk="$(find "$d" -type f -name rtk | head -1)"; chmod +x "$rtk"
          "$rtk" init --copilot
          git diff --exit-code -- .github/copilot-instructions.md .github/hooks/rtk-rewrite.json
          test -z "$(git status --porcelain -- .github)" || {{ git status --porcelain -- .github; exit 1; }}

  return-contract:
    name: Agent PR commits its return file
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: {{ fetch-depth: 0 }}
      - uses: actions/setup-python@v5
        with: {{ python-version: "{python_version}" }}
      - run: pip install -q pyyaml
      - name: Check for .migration/returns/<ticket>.<role>.yaml
        run: python .migration/harness/tools/check_return_contract.py --base "origin/${{{{ github.base_ref }}}}"

  gates:
    name: Gates (build, idiom, tests, CRAP, mutation on changed code)
    runs-on: ubuntu-latest
    env:
      AFS_BASE: origin/${{{{ github.base_ref || 'main' }}}}   # afs-mutation diffs against it
    steps:
      - uses: actions/checkout@v5
        with: {{ fetch-depth: 0 }}
      - uses: actions/setup-python@v5
        with: {{ python-version: "{python_version}" }}
      # The target's compose file (profile `services`) is the one definition of the real services tests use;
      # Copilot setup steps start the same services, so agent sessions and CI test against the same thing.
      - name: Runtimes match the profile's target stacks
        run: |
          pip install -q pyyaml
          python .migration/harness/tools/check_runtime.py
      - name: Start test services from the target's compose file
        run: python .migration/harness/tools/afs-services up
      - name: Run gates through afs-run
        run: |
          if [ ! -f {project_marker} ]; then
            echo "::notice::No target code yet ({project_marker} missing); gates start with the first slice."
            exit 0
          fi
          pip install -q {pip_packages}
          # Gate tools (pytest, ruff, …) usually live in the dev requirements.
          for f in requirements-dev.txt requirements.txt; do
            if [ -f "$f" ]; then pip install -q -r "$f"; break; fi
          done
          python - <<'PY'
          import subprocess, sys, yaml
          gates = yaml.safe_load(open(".migration/profile.yaml"))["gates"]
          rc = 0
          for gate in ("build", "idiom", "tests", "crap", "mutation_changed"):
              for i, cmd in enumerate(gates.get(gate, [])):
                  r = subprocess.run([".migration/harness/tools/afs-run", "--ticket", "ci", "--name", f"{{gate}}-{{i}}",
                                      "--", "bash", "-c", cmd], capture_output=True, text=True)
                  print(r.stdout, end=""); print(r.stderr, end="", file=sys.stderr)
                  if r.returncode:
                      # Annotations are readable through the checks API even when job logs are not.
                      tail = (r.stdout + r.stderr).strip().splitlines()[-25:]
                      msg = "%0A".join(l.replace("%", "%25").replace("\r", "") for l in tail)
                      print(f"::error title=Gate {{gate}}-{{i}} failed ({{cmd}})::{{msg}}")
                  rc = rc or r.returncode
          sys.exit(rc)
          PY
