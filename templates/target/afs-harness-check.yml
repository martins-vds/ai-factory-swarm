# Generated by AI Factory Swarm bootstrap (harness {harness_version}, {harness_commit_short}). Do not edit by hand.
# Checks on every PR: migration state is valid, harness files are unchanged, the RTK block and hook are
# what the pinned RTK writes (ADR-0015), and — once target code exists — the build, idiom and test gates.
name: AFS harness check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness:
    name: Migration state and pinned harness files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: {{ python-version: "{python_version}" }}
      - run: pip install -q {pip_packages}
      - name: Migration state is valid
        run: python .migration/harness/tools/validate.py .migration
      - name: Harness files are unchanged
        run: python .migration/harness/tools/check_installed.py
      - name: RTK block and hook match RTK {rtk_version}
        env:
          GH_TOKEN: ${{{{ github.token }}}}
        run: |
          d=$(mktemp -d)
          gh release download "v{rtk_version}" --repo {rtk_repo} --pattern "{rtk_asset}" --dir "$d"
          tar -xzf "$d/{rtk_asset}" -C "$d"
          rtk="$(find "$d" -type f -name rtk | head -1)"; chmod +x "$rtk"
          "$rtk" init --copilot
          git diff --exit-code -- .github/copilot-instructions.md .github/hooks/rtk-rewrite.json
          test -z "$(git status --porcelain -- .github)" || {{ git status --porcelain -- .github; exit 1; }}

  gates:
    name: Gates (build, idiom, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: {{ python-version: "{python_version}" }}
      - name: Run gates through afs-run
        run: |
          if [ ! -f {project_marker} ]; then
            echo "::notice::No target code yet ({project_marker} missing); gates start with the first slice."
            exit 0
          fi
          pip install -q {pip_packages}
          if [ -f requirements.txt ]; then pip install -q -r requirements.txt; fi
          python - <<'PY'
          import subprocess, sys, yaml
          gates = yaml.safe_load(open(".migration/profile.yaml"))["gates"]
          rc = 0
          for gate in ("build", "idiom", "tests"):
              for i, cmd in enumerate(gates.get(gate, [])):
                  r = subprocess.run([".migration/harness/tools/afs-run", "--ticket", "ci", "--name", f"{{gate}}-{{i}}",
                                      "--", "bash", "-c", cmd])
                  rc = rc or r.returncode
          sys.exit(rc)
          PY
