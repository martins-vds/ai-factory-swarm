# Generated by AI Factory Swarm bootstrap (harness {harness_version}, {harness_commit_short}). Do not edit by hand.
# Checks on every PR: agent PRs commit their return file, migration state is valid, harness files are unchanged, the RTK block and hook are
# what the pinned RTK writes (ADR-0015), and — once target code exists — the build, idiom and test gates.
name: AFS harness check

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness:
    name: Migration state and pinned harness files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: {{ python-version: "{python_version}" }}
      - run: pip install -q {pip_packages}
      - name: Migration state is valid
        run: python .migration/harness/tools/validate.py .migration
      - name: No unopened quirk drafts
        run: |
          # Quirk drafts are an outbox: the orchestrator opens each as an issue, links it in the ledger and
          # removes the file. A PR that still carries drafts is not ready to merge.
          if ls .migration/quirks/*.md >/dev/null 2>&1; then
            for f in .migration/quirks/*.md; do echo "::error file=$f::Quirk draft not yet opened as an issue: $f"; done
            exit 1
          fi
      - name: Harness files are unchanged
        run: python .migration/harness/tools/check_installed.py
      - name: RTK block and hook match RTK {rtk_version}
        env:
          GH_TOKEN: ${{{{ github.token }}}}
        run: |
          d=$(mktemp -d)
          gh release download "v{rtk_version}" --repo {rtk_repo} --pattern "{rtk_asset}" --dir "$d"
          tar -xzf "$d/{rtk_asset}" -C "$d"
          rtk="$(find "$d" -type f -name rtk | head -1)"; chmod +x "$rtk"
          "$rtk" init --copilot
          git diff --exit-code -- .github/copilot-instructions.md .github/hooks/rtk-rewrite.json
          test -z "$(git status --porcelain -- .github)" || {{ git status --porcelain -- .github; exit 1; }}

  return-contract:
    name: Agent PR commits its return file
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: {{ fetch-depth: 0 }}
      - uses: actions/setup-python@v5
        with: {{ python-version: "{python_version}" }}
      - run: pip install -q pyyaml
      - name: Check for .migration/returns/<ticket>.<role>.yaml
        run: python .migration/harness/tools/check_return_contract.py --base "origin/${{{{ github.base_ref }}}}"

  gates:
    name: Gates (build, idiom, tests, CRAP)
    runs-on: ubuntu-latest
    # PostgreSQL for target tests (profile target.stacks.data); harmless when the target doesn't use it.
    services:
      postgres:
        image: postgres:17
        env: {{ POSTGRES_DB: app, POSTGRES_USER: app, POSTGRES_PASSWORD: app }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      DATABASE_URL: postgres://app:app@localhost:5432/app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: {{ python-version: "{python_version}" }}
      - name: Run gates through afs-run
        run: |
          if [ ! -f {project_marker} ]; then
            echo "::notice::No target code yet ({project_marker} missing); gates start with the first slice."
            exit 0
          fi
          pip install -q {pip_packages}
          # Gate tools (pytest, ruff, …) usually live in the dev requirements.
          for f in requirements-dev.txt requirements.txt; do
            if [ -f "$f" ]; then pip install -q -r "$f"; break; fi
          done
          python - <<'PY'
          import subprocess, sys, yaml
          gates = yaml.safe_load(open(".migration/profile.yaml"))["gates"]
          rc = 0
          for gate in ("build", "idiom", "tests", "crap"):
              for i, cmd in enumerate(gates.get(gate, [])):
                  r = subprocess.run([".migration/harness/tools/afs-run", "--ticket", "ci", "--name", f"{{gate}}-{{i}}",
                                      "--", "bash", "-c", cmd], capture_output=True, text=True)
                  print(r.stdout, end=""); print(r.stderr, end="", file=sys.stderr)
                  if r.returncode:
                      # Annotations are readable through the checks API even when job logs are not.
                      tail = (r.stdout + r.stderr).strip().splitlines()[-25:]
                      msg = "%0A".join(l.replace("%", "%25").replace("\r", "") for l in tail)
                      print(f"::error title=Gate {{gate}}-{{i}} failed ({{cmd}})::{{msg}}")
                  rc = rc or r.returncode
          sys.exit(rc)
          PY
