# Generated by AI Factory Swarm bootstrap (harness {harness_version}, {harness_commit_short}). Do not edit by hand.
# Manual slice-acceptance gates run independently of the shorter Copilot cloud-agent lifetime.
name: AFS acceptance gates

on:
  workflow_dispatch:
    inputs:
      ticket:
        description: "Acceptance ticket (for example HR-04F); this run does not approve or merge anything"
        required: true
        type: string

permissions:
  contents: read

jobs:
  # ADR-0035: the target graph is built for this exact commit, gated in this run and kept in its artifact.
  graph:
    permissions:
      contents: write
      pull-requests: write
      copilot-requests: write
    uses: ./.github/workflows/afs-understand.yml
    with: {{ side: target, publish: false }}
    secrets: inherit
  acceptance:
    needs: graph
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      AFS_ACCEPTANCE_TICKET: ${{{{ inputs.ticket }}}}
      AFS_ACCEPTANCE_OUT: .migration/runs/acceptance-${{{{ github.run_id }}}}-${{{{ github.run_attempt }}}}
      AFS_GRAPH_TARGET_BUILD: .migration/runs/graph-target-${{{{ github.run_id }}}}
    steps:
      - uses: actions/checkout@v5
        with: {{ fetch-depth: 0 }}
      - name: Fetch the target graph built for this commit
        uses: actions/download-artifact@v4
        with:
          name: afs-graph-target
          path: ${{{{ env.AFS_GRAPH_TARGET_BUILD }}}}
      - uses: actions/setup-python@v5
        with: {{ python-version: "{python_version}" }}
      - name: Install gate dependencies
        run: |
          pip install -q {pip_packages}
          for f in requirements-dev.txt requirements.txt; do
            if [ -f "$f" ]; then pip install -q -r "$f"; break; fi
          done
          # A target that tests its UI in a browser lists Playwright in its dev requirements; its browser
          # isn't a pip package, so install it here (sessions can't edit this generated file).
          if python -c "import playwright" 2>/dev/null; then python -m playwright install --with-deps chromium; fi
      - name: Start real test services
        run: python .migration/harness/tools/afs-services up
      - name: Run fresh acceptance gates, including full mutation
        timeout-minutes: 330
        run: |
          python .migration/harness/tools/afs-acceptance run \
            --ticket "$AFS_ACCEPTANCE_TICKET" --out "$AFS_ACCEPTANCE_OUT"
      - name: Preserve evidence even when a gate fails or is interrupted
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: afs-acceptance-${{{{ github.sha }}}}-${{{{ github.run_id }}}}-${{{{ github.run_attempt }}}}
          path: ${{{{ env.AFS_ACCEPTANCE_OUT }}}}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
  # Copilot's firewall allows only some of the storage hosts that serve artifacts, so a session's download
  # can fail by luck (pilot BK-ACCEPT, run 42506832839). This job, on GitHub's runner, republishes the
  # artifact as a branch the session fetches over git; `afs-acceptance fetch` + `verify` check it as before.
  # It is the only job with write access, and it runs no target code.
  publish:
    needs: acceptance
    if: ${{{{ always() && needs.acceptance.result != 'skipped' }}}}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download this run's evidence
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: afs-acceptance-${{{{ github.sha }}}}-${{{{ github.run_id }}}}-${{{{ github.run_attempt }}}}
          path: evidence
      - name: Publish it to afs/acceptance/<run>-<attempt>
        if: ${{{{ !cancelled() && steps.download.outcome == 'success' }}}}
        env:
          GH_TOKEN: ${{{{ github.token }}}}
          BRANCH: afs/acceptance/${{{{ github.run_id }}}}-${{{{ github.run_attempt }}}}
        run: |
          cd evidence
          git init -q -b "$BRANCH"
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Acceptance evidence: run ${{{{ github.run_id }}}} attempt ${{{{ github.run_attempt }}}} at ${{{{ github.sha }}}}"
          git push -q "https://x-access-token:${{GH_TOKEN}}@github.com/${{{{ github.repository }}}}.git" "HEAD:refs/heads/$BRANCH"
          echo "Evidence branch: $BRANCH" >> "$GITHUB_STEP_SUMMARY"
