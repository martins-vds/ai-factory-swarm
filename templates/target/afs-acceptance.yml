# Generated by AI Factory Swarm bootstrap (harness {harness_version}, {harness_commit_short}). Do not edit by hand.
# Manual slice-acceptance gates run independently of the shorter Copilot cloud-agent lifetime.
name: AFS acceptance gates

on:
  workflow_dispatch:
    inputs:
      ticket:
        description: "Acceptance ticket (for example HR-04F); this run does not approve or merge anything"
        required: true
        type: string

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      AFS_ACCEPTANCE_TICKET: ${{{{ inputs.ticket }}}}
      AFS_ACCEPTANCE_OUT: .migration/runs/acceptance-${{{{ github.run_id }}}}-${{{{ github.run_attempt }}}}
    steps:
      - uses: actions/checkout@v5
        with: {{ fetch-depth: 0 }}
      - uses: actions/setup-python@v5
        with: {{ python-version: "{python_version}" }}
      - name: Install gate dependencies
        run: |
          pip install -q {pip_packages}
          for f in requirements-dev.txt requirements.txt; do
            if [ -f "$f" ]; then pip install -q -r "$f"; break; fi
          done
      - name: Start real test services
        run: python .migration/harness/tools/afs-services up
      - name: Run fresh acceptance gates, including full mutation
        timeout-minutes: 330
        run: |
          python .migration/harness/tools/afs-acceptance run \
            --ticket "$AFS_ACCEPTANCE_TICKET" --out "$AFS_ACCEPTANCE_OUT"
      - name: Preserve evidence even when a gate fails or is interrupted
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: afs-acceptance-${{{{ github.sha }}}}-${{{{ github.run_id }}}}-${{{{ github.run_attempt }}}}
          path: ${{{{ env.AFS_ACCEPTANCE_OUT }}}}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
