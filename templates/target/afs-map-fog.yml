# Generated by AI Factory Swarm bootstrap (harness {harness_version}, {harness_commit_short}). Do not edit by hand.
# ADR-0022: when a slice epic (label afs:slice, or named as `epic:` by a slice spec) closes, open a wayfinder:task on the decision map to re-walk
# its "Not yet specified" fog, assigned to whoever closed the epic, so the re-walk is a ticket, not a memory.
name: AFS map fog

on:
  issues:
    types: [closed]

jobs:
  rewalk:
    if: ${{{{ !github.event.issue.pull_request }}}}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - run: pip install -q pyyaml
      - name: Open the re-walk task on the decision map
        env:
          GH_TOKEN: ${{{{ github.token }}}}
        run: |
          python3 .migration/harness/tools/fog_rewalk.py --repo "${{{{ github.repository }}}}" \
            --epic "${{{{ github.event.issue.number }}}}" --closed-by "${{{{ github.event.sender.login }}}}"
