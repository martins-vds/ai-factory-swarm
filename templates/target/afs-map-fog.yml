# Generated by AI Factory Swarm bootstrap (harness {harness_version}, {harness_commit_short}). Do not edit by hand.
# When a slice epic (label afs:slice, or named as `epic:` by a slice spec) closes:
# ADR-0024: every ticket under it must be closed and have its return file, or the epic is reopened with the list;
# ADR-0022: then a wayfinder:task opens on the decision map to re-walk its "Not yet specified" fog, assigned to
# whoever closed the epic, so the re-walk is a ticket, not a memory.
# Run it by hand (workflow_dispatch) for an epic that closed before this workflow existed; re-runs are safe.
name: AFS map fog

on:
  issues:
    types: [closed]
  workflow_dispatch:
    inputs:
      epic:
        description: "Slice epic issue number (already closed)"
        required: true

jobs:
  rewalk:
    if: ${{{{ github.event_name == 'workflow_dispatch' || !github.event.issue.pull_request }}}}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v5
        with: {{ fetch-depth: 0 }}   # rule date and superseded return attribution require full HEAD ancestry
      - run: pip install -q pyyaml jsonschema
      - name: Every ticket of the slice is closed and has its return file
        env:
          GH_TOKEN: ${{{{ github.token }}}}
        run: |
          python3 .migration/harness/tools/check_slice_returns.py --repo "${{{{ github.repository }}}}" \
            --epic "${{{{ inputs.epic || github.event.issue.number }}}}" --reopen
      - name: Open the re-walk task on the decision map
        env:
          GH_TOKEN: ${{{{ github.token }}}}
        run: |
          python3 .migration/harness/tools/fog_rewalk.py --repo "${{{{ github.repository }}}}" \
            --epic "${{{{ inputs.epic || github.event.issue.number }}}}" --closed-by "${{{{ github.event.sender.login }}}}"
