# Generated by AI Factory Swarm bootstrap (harness {harness_version}, {harness_commit_short}). Do not edit by hand.
# afs-coverage: no-verdict (reports or prepares; it has no failing verdict to drill, ADR-0027)
# ADR-0021: once a day, record GitHub's billed AI credits and Actions minutes for the account in the profile
# (`costs.billing`), rebuild the cost report, and propose both as a PR. Needs the BILLING_READ_TOKEN secret
# (operator checklist); without it the run only warns.
name: AFS costs

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "UTC day to fetch (YYYY-MM-DD); empty = yesterday"
        required: false
        default: ""

jobs:
  costs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: {{ python-version: "{python_version}" }}
      - run: pip install -q pyyaml
      - name: Fetch billed usage
        env:
          BILLING_READ_TOKEN: ${{{{ secrets.BILLING_READ_TOKEN }}}}
        run: |
          d="${{{{ inputs.date }}}}"; [ -n "$d" ] || d=$(date -u -d yesterday +%F)
          echo "DAY=$d" >> "$GITHUB_ENV"
          python .migration/harness/tools/afs-costs fetch --date "$d"
      - name: Rebuild the cost report
        run: python .migration/harness/tools/afs-costs report --out .migration/costs/report.md
      - name: Propose as a PR
        env:
          GH_TOKEN: ${{{{ github.token }}}}
        run: |
          [ -n "$(git status --porcelain -- .migration/costs)" ] || {{ echo "No cost changes."; exit 0; }}
          b="afs/costs-$DAY-${{{{ github.run_id }}}}"
          git switch -c "$b" && git add .migration/costs
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Costs: billed usage for $DAY and report"
          git push -q origin "$b"
          gh pr create --base "${{{{ github.ref_name }}}}" --head "$b" --title "Costs: $DAY" \
            --body-file .migration/costs/report.md \
            || echo "::notice::Branch $b pushed; open the PR by hand (Actions may not be allowed to create PRs)."
