# Generated by AI Factory Swarm bootstrap (harness {harness_version}, {harness_commit_short}). Do not edit by hand.
# ADR-0031: a slice's human sign-off (`human_check: passed` in a Slice Coordinator's return file) counts only
# with an approving review, by a login in the profile's signoff.approvers, on the PR's current head commit.
# Runs again when a review is submitted or dismissed, and on every push to the default branch, so a merge made
# with plain git can't skip it.
name: AFS human sign-off

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted, dismissed]
  push:
    branches: [main]

jobs:
  signoff:
    name: Human sign-off is an approver's review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with: {{ fetch-depth: 0 }}
      - uses: actions/setup-python@v5
        with: {{ python-version: "{python_version}" }}
      - run: pip install -q pyyaml
      - name: Check the sign-off
        env:
          GH_TOKEN: ${{{{ github.token }}}}
        run: |
          if [ "${{{{ github.event_name }}}}" = push ]; then
            python3 .migration/harness/tools/check_signoff.py --repo "${{{{ github.repository }}}}" \
              --range "${{{{ github.event.before }}}}..${{{{ github.sha }}}}"
          else
            python3 .migration/harness/tools/check_signoff.py --repo "${{{{ github.repository }}}}" \
              --pr "${{{{ github.event.pull_request.number }}}}" --base "origin/${{{{ github.event.pull_request.base.ref }}}}"
          fi
