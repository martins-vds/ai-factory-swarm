# Generated by AI Factory Swarm bootstrap (harness {harness_version}, {harness_commit_short}). Do not edit by hand:
# re-run bootstrap instead. Runs before every Copilot coding agent session; it must live on the default branch.
# A failed step does NOT stop the agent, so every role agent runs the afs-setup-check skill first (ADR-0008).
name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/copilot-setup-steps.yml]
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml]

jobs:
  # The job MUST be called `copilot-setup-steps` or Copilot will not pick it up.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out target repo (full history: afs-mutation diffs against origin/main)
        uses: actions/checkout@v5
        with: {{ fetch-depth: 0 }}

      - name: Read pinned source from .migration/source.lock
        id: lock
        run: |
          echo "repo=$(awk '/^repo:/{{print $2}}' .migration/source.lock)" >> "$GITHUB_OUTPUT"
          echo "sha=$(awk '/^sha:/{{print $2}}' .migration/source.lock)" >> "$GITHUB_OUTPUT"

      # SOURCE_READ_TOKEN (private sources only): fine-grained PAT with Contents: Read-only on the source repo ONLY.
      # Store it as a secret in this repo's `copilot` environment (Settings → Environments → copilot).
      - name: Check out source (read-only, pinned)
        uses: actions/checkout@v5
        with:
          repository: ${{{{ steps.lock.outputs.repo }}}}
          ref: ${{{{ steps.lock.outputs.sha }}}}
          token: ${{{{ secrets.SOURCE_READ_TOKEN || github.token }}}}   # public sources need no secret
          path: .source
          persist-credentials: false

      - name: Make the source checkout read-only
        run: |
          git -C .source remote set-url --push origin DISABLED-read-only-source
          chmod -R a-w .source
          echo "Source pinned at $(git -C .source rev-parse HEAD)"

      - name: Install RTK {rtk_version} ({rtk_asset})
        env:
          GH_TOKEN: ${{{{ github.token }}}}
        run: |
          d=$(mktemp -d)
          gh release download "v{rtk_version}" --repo {rtk_repo} --pattern "{rtk_asset}" --dir "$d"
          tar -xzf "$d/{rtk_asset}" -C "$d"
          mkdir -p "$HOME/.local/bin"
          install -m 755 "$(find "$d" -type f -name rtk | head -1)" "$HOME/.local/bin/rtk"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/rtk" --version

      - uses: actions/setup-python@v5
        with: {{ python-version: "{python_version}" }}

      - name: Harness tool dependencies, plus the target's own dev requirements (pytest, mutmut, ruff, …)
        run: |
          pip install -q {pip_packages}
          for f in requirements-dev.txt requirements.txt; do
            if [ -f "$f" ]; then pip install -q -r "$f"; break; fi
          done

      # Understand Anything at its pinned commit, with the harness patches (ADR-0009). Role agents load it
      # from $HOME/.afs/understand-anything.
      - name: Install Understand Anything ({ua_commit_short})
        run: |
          ua="$HOME/.afs/understand-anything"
          git init -q "$ua"
          git -C "$ua" fetch -q --depth 1 https://github.com/{ua_repo} {ua_commit}
          git -C "$ua" checkout -q FETCH_HEAD
{ua_patch_steps}
          echo "Understand Anything $(git -C "$ua" rev-parse --short HEAD) ready at $ua"
