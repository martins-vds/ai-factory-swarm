# Sample migration profile: the AI Factory Swarm pilot (Java EE → Python/Django).
# Validated against schemas/profile.schema.json. Copied and edited by bootstrap into each target repo.
harness_version: 0.2.0
source:
  repo: martins-vds/code-migration-hackathon
  sha: c2df7607e3b6a997dd27eb2917bc33e4ec0f6692
  path: java/
  stacks: [java-8, ejb-3, jpa-eclipselink, jsf-adf-faces, weblogic-12, oracle-db]
  encoding: windows-1252            # spike M1-5
target:
  repo: martins-vds/ai-factory-pilot-target
  stacks:
    backend: [python-3.13, django-5]
    frontend: [django-templates]
    data: [postgresql-17]
  architecture:
    style: clean-architecture
    adrs: []
characterization:
  tier: B
  reason: No running legacy environment; the build needs a proprietary WebLogic client, but the code compiles in isolation against public artifacts plus stand-ins (spike M1-5).
graph:
  tool: understand-anything
  commit: 4e6d3299017a7432da15957874992837a315c5b4
  patches: [understand-anything/argument-hint.patch]
  enrich: {source: [java-ee], target: [django]}       # ADR-0020: harness enrichers (stack pack graph block)
  require:                                             # types each side's graph must contain (graph_gate.py)
    source: {nodes: [table, page, endpoint], edges: [reads_from, writes_to, routes, calls]}
    target: {nodes: [table, endpoint], edges: [reads_from, writes_to, routes, calls]}
risk_map:
  exclude: ["*.min.js", "*/webapp/js/*", "*/generated/*"]
skills:
  source:
    read: [java-docs]
    characterize: [java-junit]
  target:
    patterns: [django-patterns]
    security: [django-security]
    async: [django-celery]
  specialists:
    data: [reviewing-oracle-to-postgres-migration, migrating-oracle-to-postgres-stored-procedures]
gates:
  build: ["python -m compileall -q src", "python manage.py check"]
  idiom: ["ruff check", "ruff format --check"]
  tests: ["pytest -q"]
  crap: ["pytest -q --cov=src --cov-report=lcov:.migration/runs/crap.lcov", "lizard --csv src > .migration/runs/lizard.csv", "python .migration/harness/tools/crap.py .migration/runs/lizard.csv --lcov .migration/runs/crap.lcov --max 30"]
  mutation_changed: ["python .migration/harness/tools/afs-mutation --changed-since origin/main"]
  mutation_full: ["python .migration/harness/tools/afs-mutation --all"]
thresholds:
  crap_max_per_method: 30
  mutation_score_min: 0.8
concurrency:
  max_parallel_workers: 4
  remote_workers: true
context:
  working_budget: 0.45
  soft_limit: 0.6
rtk:
  edition: oss
  version: 1.1.0
data:
  masking: false
  snapshot_owner: operations-team
# Real services the tests run against, from the target's compose file (written with the Docker skills).
# Copilot setup steps and the CI gates start `test` with tools/afs-services. Required when target.stacks.data is set.
services:
  compose: compose.yaml
  test: [db]
costs:                       # ADR-0021: billed AI credits and Actions minutes (AFS costs workflow)
  billing: {scope: organization, account: example-org}
signoff:                     # ADR-0031: whose approving review on the coordinator's PR is the human sign-off
  approvers: [example-approver]
self_heal:                   # ADR-0034: the stop hook sends an agent back to fix what CI would reject
  enabled: false             # turn on after the self-heal drills pass on this target
  max_blocks: 2              # then a 'self-check failed' handoff, and the agent stops
translation_rules: .migration/translation-rules.md
