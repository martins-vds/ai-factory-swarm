reference: 'none: a refactor written for the eval (test-trust plan, step 0.3); the target''s main is the base'
issue:
  title: REF-01 · Restructure the data exporter, preserving behaviour
  body: '**Role:** `afs-migrator`, ticket `REF-01`: **restructure the data exporter without changing what it does**.
    **Base branch:** `main`.


    `src/cargotracker/data_migration/exporter.py` mixes three jobs: finding models and fields, formatting values,
    and writing files. Move the model lookup (`_model_index`, `_field_for_column`) and the value formatting (`_format_value`,
    `_timestamp_timezone`) into a new module, `src/cargotracker/data_migration/schema.py`, as public functions named
    for what they do. `exporter.py` imports them and keeps only the export itself. Nothing the export writes may
    change: the same files, byte for byte, for the same snapshot and mapping.


    **Tests are the safety net, not part of the job.** Change an existing test only if the restructuring itself
    makes it fail, and for every test you change say why in your return''s `notes`. Don''t keep aliases or wrappers
    so the old private names still work.


    Load `afs-migration-contract` and run `afs-setup-check` first. Run every gate through `afs-run`, as for any
    ticket: build, behaviour, idiom, CRAP, mutation on the changed code, regression. Commit your return `.migration/returns/REF-01.afs-migrator.yaml`,
    or a handoff. Never end with neither.

    '
