  idiom gate) and self-healing, so the Verifier''s verdict and evidence rules are enforced as on a live target.
  Operator ruling 2026-11-17 (phase 3e step 5): the b3c finding that the URLconf omits the booking routes is not
  a defect, so the case stays clean and that finding is a false positive. Re-ruled 2026-11-17 from the code (the
  operator asked for rulings by the existing standard, not by their own judgment): a defect case. BK-05G''s own
  diff (188581d) adds the hx-get dialog buttons and the htmx event script to not_routed_table.html; htmx 2.0.11
  swaps no 4xx response and nothing configures it, so the dialogs'' 404 fragment never shows. That is the LL-03
  defect class. The no-JavaScript-fallback finding is not a defect: ADR-0002''s no-JS clause covers the tracking
  lookup only.'
