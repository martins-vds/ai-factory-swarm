issue:
  title: BK-05G · Build destination and deadline edit dialogs
  body: '**Ticket:** `BK-05G`. **Role:** `afs-specialist-migrator`, `specialty: ui`. Slice epic: #224. Parent task:
    #222.


    From the approved plan:


    - **Size:** M

    - **Role:** `afs-specialist-migrator`

    - **Specialty:** `ui`

    - **Files:** `src/cargotracker/booking/interfaces/dialogs/views.py`, `templates/booking/dialogs/`, `tests/booking/interfaces/test_dialogs.py`

    - **Blocked by:** BK-05A and BK-05E.

    - **Scope:** Add destination and deadline dialogs to the not-routed table. Apply #234 by showing a field error
    when the deadline cannot be parsed; apply #235 by filtering destination options without mutating the backing
    location list; apply #251 by omitting the unavailable-widget warning while preserving successful updates and
    dialog completion.

    - **Tests:** Cover initial values, filtered options and stable subsequent renders, parse-error feedback, successful
    updates, retained route-specification fields, successful dialog completion without the warning, and refreshed
    rows. Cover the change-destination/deadline contracts at the UI boundary.

    - **Capabilities:** `booking.dialog-chain`, `booking.dialog-deadline`, `booking.dialog-destination`.


    Approved plan: `.migration/plan/booking.md` (#259, revised in #264 and #279). Rulings: #89 (routing), #92, and
    the booking quirk rulings #232–#239 and #250–#252 (all closed). Legacy tests transcribed by BK-03 (`tests/characterization/test_booking.py`)
    become target tests in the tickets that implement them. Load `afs-migration-contract`, run `afs-setup-check`
    (it unshallows first), and run every gate through `afs-run`. Commit your return file `.migration/returns/<ticket>.<role>.yaml`
    (`issue:` this ticket). **Touch only the files listed.**


    **Operator scope extension (2026-11-07, carried into this case):** the dialogs open from the dashboard''s not-routed
    table, which belongs to BK-05E.


    AFS-SCOPE: templates/booking/dashboard/not_routed_table.html


    Change that template only to open the dialogs; keep BK-05E''s table behaviour and tests green.


    ---

    _Generated by [Claude Code](https://claude.ai/code)_

    '
