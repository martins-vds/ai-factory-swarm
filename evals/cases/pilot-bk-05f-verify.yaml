    - python .migration/harness/tools/check_ui.py
- yaml_set:
    file: .migration/profile.yaml
    key: self_heal
    value:
      enabled: true
      max_blocks: 2
- yaml_set:
    file: .migration/profile.yaml
    key: ui_checks
    value:
