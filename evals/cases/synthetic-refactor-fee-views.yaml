issue:
  title: REF-02 · Move the fee views' helpers into their own module, preserving behaviour
  body: '**Role:** `afs-migrator`, ticket `REF-02`: **restructure the fee views without changing what they do**.
    **Base branch:** `main`.


    `src/fees/views.py` holds the request handlers and three helpers: `_fee_amount`, `_gateway_result` and `_fee_or_404`.
    Move the helpers into a new module, `src/fees/presentation.py`, as public functions named for what they do,
    and have the views import them. Every page, JSON response and status code stays exactly as it is.


    **Tests are the safety net, not part of the job.** Change an existing test only if the restructuring itself
    makes it fail, and for every test you change say why in your return''s `notes`. Don''t keep aliases or wrappers
    so the old private names still work.


    Load `afs-migration-contract` and run `afs-setup-check` first. Run every gate through `afs-run`, as for any
    ticket: build, behaviour, idiom, CRAP, mutation on the changed code, regression. Commit your return `.migration/returns/REF-02.afs-migrator.yaml`,
    or a handoff. Never end with neither.

    '
