issue:
  title: SY-04 · Analyse and inventory the legacy source
  body: '**Role:** `afs-analyst`, ticket `SY-04`: **understand the legacy source and inventory it** (Phase 2). **Base
    branch:** `main`.


    The bootstrap gate is clear: every capability is met or waived (`.migration/capabilities.yaml`). The full source
    graph is merged at `.migration/graphs/source/full/` and passes the graph gate. The source is the pinned, read-only
    checkout `.source/` (`.migration/source.lock`, path `legacy`).


    Follow your procedure: graph first; enrich; **inventory every capability** of the source into the fidelity ledger
    (`.migration/ledger/`, `status: pending`); build the best-effort risk map from the source CRAP tooling (`.migration/risk-map/`);
    and raise quirks as they come up. Everything in `legacy/` is in scope: code, resources and the documents under
    `legacy/docs/`.


    Load `afs-migration-contract` and run `afs-setup-check` first; run every tool through `afs-run`. Read-only on
    `legacy/`.


    **Return:** `.migration/returns/SY-04.afs-analyst.yaml` (`issue:` this issue), or a handoff. Never end with
    neither.


    **Only if your agent is `afs-understander`:** after SY-04, also do ticket **SY-05** in the same session: the
    Characterizer''s procedure for every capability you inventoried, at tier A (the source runs, `.migration/references/characterization.md`).
    A characterization harness exists at `.migration/characterization/source/`; extend it rather than starting over.
    Record observed against predicted behaviour, set each entry''s characterization fields, inventory any legacy
    tests, raise new quirks as drafts, and commit `.migration/returns/SY-05.afs-characterizer.yaml`.

    '
chain:
  agent: afs-characterizer
  ticket: SY-05
  role: afs-characterizer
  title: SY-05 · Characterize the legacy source's capabilities
  body: '**Role:** `afs-characterizer`, ticket `SY-05`: **characterize every ledger capability** before planning.
    **Base branch:** {work_pr}, where the Analyst''s inventory is (`.migration/ledger/`, `status: pending`, with
    the risk map in `.migration/risk-map/`).


    - **Tier:** the source runs (tier A, `.migration/references/characterization.md`).

    - **Harness:** a characterization harness exists at `.migration/characterization/source/` (SY-03). Extend it
    rather than starting over.


    For each ledger entry, capture what the source actually does at the best tier available *for that capability*,
    record observed versus predicted behaviour, and set the entry''s characterization fields (tier, evidence, verification
    method). Inventory any legacy tests. Raise new quirks as drafts in `.migration/quirks/`, as your skill describes.
    Record quirky behaviour as it is; don''t rule on it.


    Load `afs-migration-contract` and run `afs-setup-check` first. Run every tool through `afs-run`. Read-only on
    `legacy/`.


    **Return:** `.migration/returns/SY-05.afs-characterizer.yaml` (`issue:` this issue), or a handoff. Never end
    with neither.

    '
