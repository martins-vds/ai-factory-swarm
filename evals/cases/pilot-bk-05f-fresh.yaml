issue:
  title: BK-05F · Build route selection and itinerary screens
  body: '**Ticket:** `BK-05F`. **Role:** `afs-specialist-migrator`, `specialty: ui`. Slice epic: #224. Parent task:
    #222.


    From the approved plan:


    - **Size:** M

    - **Role:** `afs-specialist-migrator`

    - **Specialty:** `ui`

    - **Files:** `src/cargotracker/booking/interfaces/route_selection/views.py`, `templates/booking/route_selection/`,
    `tests/booking/interfaces/test_route_selection.py`

    - **Blocked by:** BK-05C and BK-05E.

    - **Scope:** Present cargo route details, candidate counts, numbered itinerary legs, no-route guidance, and
    route assignment. Apply #236: after assignment redirect to the cargo-details page at `/admin/cargo/<tracking_id>/`.
    Apply #252 by rendering candidate routes when present (the Planner''s choice under the ruling); retain the empty-candidate
    message otherwise.

    - **Tests:** Cover populated and empty candidate lists, candidate assignment, redirect destination, and resulting
    details page. Exercise the unannotated candidate properties as target assertions, not as executed legacy-test
    evidence (#239).

    - **Capabilities:** `booking.routing-chain`, `booking.screen-route`, `booking.screen-select-itinerary`, `booking.routing-assign`.


    Approved plan: `.migration/plan/booking.md` (#259, revised in #264 and #279). Rulings: #89 (routing), #92, and
    the booking quirk rulings #232–#239 and #250–#252 (all closed). Legacy tests transcribed by BK-03 (`tests/characterization/test_booking.py`)
    become target tests in the tickets that implement them. Load `afs-migration-contract`, run `afs-setup-check`
    (it unshallows first), and run every gate through `afs-run`. Commit your return file `.migration/returns/<ticket>.<role>.yaml`
    (`issue:` this ticket). **Touch only the files listed.**


    ---

    _Generated by [Claude Code](https://claude.ai/code)_

    '
