issue:
  title: DM-05F · Business invariants on the loaded data
  body: '**Ticket:** `DM-05F`. Slice epic: #247. Parent task: #223.


    Tests that load the snapshot (or a fixture in the snapshot format) with `load_data_snapshot`, then check what
    the data still means:

    - each cargo''s re-derived delivery state matches its stored state and its handling history;

    - every itinerary''s legs connect;

    - every handling event''s voyage and location exist;

    - each voyage''s `carrier_movement` schedule is in order.

    - **Files:** `tests/data_migration/test_invariants.py`.


    **Role:** `afs-specialist-migrator`, `specialty: data`. Load `afs-migration-contract`, `afs-data-pipeline` (ADR-0032),
    then run `afs-setup-check`. Copilot setup steps fetch the snapshot into `.migration/data/snapshot/` (gitignored):
    **never commit its rows**. Plan: `.migration/plan/data-migration.md` (approved, #261). Rulings: #254 (add `carrier_movement`),
    #255 (realign sequences; `SEQUENCE` excluded), and the two-phase load (#258). Run gates through `afs-run`. Commit
    your return file `.migration/returns/<ticket>.afs-specialist-migrator.yaml` (`issue:` this ticket). **Touch
    only the files listed.**


    ---

    _Generated by [Claude Code](https://claude.ai/code)_'
