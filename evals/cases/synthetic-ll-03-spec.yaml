- yaml_set:
    file: .migration/ledger/fees.calculation.yaml
    key: rules
    value:
    - id: late-days-end-at-return
      rule: Days late run from the due date (14 days after lending) to the return date, or to today while the loan is out;
        never below zero.
      source: legacy/src/main/java/lib/LateFeeView.java:31-37
    - id: fee-waived-two-days
      rule: Up to two days late costs nothing.
      source: legacy/src/main/java/lib/LateFeeView.java:31-37
    - id: fee-25-cents-a-day
      rule: Beyond two days, every day late costs 25 cents, the first two included.
      source: legacy/src/main/java/lib/LateFeeView.java:31-37
    - id: fee-capped-at-10
      rule: The fee never exceeds $10.00.
      source: legacy/src/main/java/lib/LateFeeView.java:31-37
    - id: unknown-loan-404
      rule: A fee for a loan that doesn't exist is answered with 404.
      source: .migration/characterization/source/goldens/http.json
- yaml_set:
    file: .migration/profile.yaml
    key: gates.spec
    value:
    - python .migration/harness/tools/afs-spec run
- yaml_set:
    file: .migration/profile.yaml
    key: spec
    value:
      adapter: django
      required: false
