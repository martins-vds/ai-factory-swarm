    - **Decisions:** map #38. Quirk rulings #39–#43 are all **fix**.\n\n**Customer spec (ADR-0062):** `.migration/spec/fees-payments/late-fees.yaml`\
    \ was written and reviewed before this ticket. It is your acceptance test: run the profile's `spec` gate through `afs-run`\
