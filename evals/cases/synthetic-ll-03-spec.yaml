    \nView and pay late fees.\n\n- **Capabilities:** `fees.calculation`, `fees.page`, `integration.payment-gateway`\n- **Blocked\
    \ by:** LL-02\n- **Files** (touch only these, plus your return, journal and handoff):\n  - `config/urls.py`\n  - `src/fees/`\n\
