name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Schemas, afs-run, skill lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install jsonschema pyyaml
      - name: Unit tests (schemas, afs-run)
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate sample migration state
        run: python tools/validate.py templates/migration
      - name: Check skills.lock.json and stack packs (offline)
        run: |
          python tools/check_lock.py
          for p in stacks/*.json; do python tools/check_lock.py --lock "$p" --base skills.lock.json; done

  upstream:
    name: Pinned upstream (paths and vendored copies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Every pinned skill path exists at its commit
        run: python tools/check_lock.py --remote
      - name: Every stack-pack path exists at its commit
        run: for p in stacks/*.json; do python tools/check_lock.py --lock "$p" --base skills.lock.json --remote; done
      - name: Bootstrap installs the pilot profile end to end (fetches every public pinned skill)
        run: |
          pip install -q jsonschema pyyaml
          d=$(mktemp -d)
          python tools/bootstrap.py --target "$d" --profile templates/migration/profile.yaml \
            --capabilities templates/migration/capabilities.yaml --stack-pack stacks/java-to-django.json --skip-needs-license
          (cd "$d" && python .migration/harness/tools/check_installed.py && python .migration/harness/tools/validate.py .migration)
      - name: Vendored afs- skills match their pinned upstream
        run: python tools/vendor_skills.py --check
      - name: Patches apply at their pinned commits
        run: |
          set -e
          commit=$(python -c "import json;print(json.load(open('skills.lock.json'))['sources']['understand-anything']['commit'])")
          d=$(mktemp -d); git -C "$d" init -q
          git -C "$d" fetch -q --depth 1 https://github.com/Egonex-AI/Understand-Anything "$commit"
          git -C "$d" checkout -q FETCH_HEAD
          git -C "$d" apply --check "$GITHUB_WORKSPACE/patches/understand-anything/argument-hint.patch"
          echo "patch applies at ${commit:0:7}"
