name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Schemas, afs-run, skill lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install jsonschema pyyaml pytest pytest-cov "mutmut==2.5.1"
      - name: Unit tests (schemas, afs-run)
        run: |
          set -o pipefail
          if ! python -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee /tmp/unittest.log; then
            # Annotations stay readable when job logs are not.
            echo "::error title=Unit tests failed::$(grep -v '^\(test_\|ok$\)' /tmp/unittest.log | tail -40 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi
      - name: Validate sample migration state
        run: |
          python tools/validate.py --sample templates/migration
          for d in examples/*/; do python tools/validate.py --sample "$d"; done
      - name: Return schema matches the agents' return contracts
        run: python tools/gen_return_schema.py --check
      - name: Check skills.lock.json and stack packs (offline)
        run: |
          python tools/check_lock.py
          for p in stacks/*.json; do python tools/check_lock.py --lock "$p" --base skills.lock.json; done

  operator-dashboard:
    name: Operator dashboard acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tests/dashboard-bdd/package-lock.json
      - run: python -m pip install pyyaml
      - run: npm ci
        working-directory: tests/dashboard-bdd
      - run: npx --no-install playwright install --with-deps --only-shell chromium
        working-directory: tests/dashboard-bdd
      - run: npm test
        working-directory: tests/dashboard-bdd

  upstream:
    name: Pinned upstream (paths and vendored copies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Every pinned skill path exists at its commit
        run: python tools/check_lock.py --remote --skip-private
      - name: Every stack-pack path exists at its commit
        run: for p in stacks/*.json; do python tools/check_lock.py --lock "$p" --base skills.lock.json --remote; done
      - name: Bootstrap installs the pilot profile end to end (fetches every public pinned skill)
        run: |
          pip install -q jsonschema pyyaml
          d=$(mktemp -d)
          printf 'services:\n  db:\n    image: postgres:17\n    healthcheck:\n      test: [CMD, pg_isready]\n' > "$d/compose.yaml"
          python tools/bootstrap.py --target "$d" --profile templates/migration/profile.yaml \
            --capabilities templates/migration/capabilities.yaml --stack-pack stacks/java-to-django.json --skip-private-sources \
            --allow-unreleased
          (cd "$d" && python .migration/harness/tools/check_installed.py && python .migration/harness/tools/validate.py .migration)
      - name: Vendored afs- skills match their pinned upstream
        run: python tools/vendor_skills.py --check
      - name: Patches apply at their pinned commits
        run: |
          set -e
          commit=$(python -c "import json;print(json.load(open('skills.lock.json'))['sources']['understand-anything']['commit'])")
          d=$(mktemp -d); git -C "$d" init -q
          git -C "$d" fetch -q --depth 1 https://github.com/Egonex-AI/Understand-Anything "$commit"
          git -C "$d" checkout -q FETCH_HEAD
          git -C "$d" apply --check "$GITHUB_WORKSPACE/patches/understand-anything/argument-hint.patch"
          echo "patch applies at ${commit:0:7}"

  synthetic-sources:
    name: Synthetic legacy sources behave as designed (ADR-0037)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: legacy builds, starts, and its holds behave as designed (the scenario stays here, not in the target)
        working-directory: synthetic/legacy
        run: |
          mvn -q -B package -DskipTests
          (PORT=8080 java -cp "target/classes:target/dependency/*" lib.App > /tmp/app.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf localhost:8080/loans >/dev/null && break; sleep 1; done
          # expect STATUS [TEXT] -- CURL ARGS: fail loudly unless the answer has that status (and contains TEXT)
          expect() { want=$1; shift; text=""; if [ "$1" != -- ]; then text=$1; shift; fi; shift
            got=$(curl -s -o /tmp/body -w '%{http_code}' "$@")
            if [ "$got" != "$want" ] || { [ -n "$text" ] && ! grep -q -- "$text" /tmp/body; }; then
              echo "::error::$* answered $got: $(cat /tmp/body) (wanted $want ${text:+with $text})"; exit 1; fi; }
          queue() { curl -sf "localhost:8080/holds?isbn=$1" | cut -d';' -f2 | tr '\n' ,; }
          isbn=9780134685991                                  # L1, out with ana
          today=$(date -u +%F); expires=$(date -u -d "+30 days" +%F)
          expect 200 -- localhost:8080/holds
          if grep -q '^H1;' /tmp/body; then echo "::error::the seeded hold H1 (placed 2026-01-05) should have expired"; exit 1; fi
          expect 400 'member and isbn are required' -- -X POST -d member=dee localhost:8080/holds
          expect 409 'book is available' -- -X POST -d member=dee -d isbn=9780596007126 localhost:8080/holds
          expect 409 'member has this book' -- -X POST -d member=ana -d isbn=$isbn localhost:8080/holds
          expect 201 "H2;dee;$isbn;$today;$expires" -- -X POST -d member=dee -d isbn=$isbn localhost:8080/holds
          expect 409 'already on hold' -- -X POST -d member=dee -d isbn=$isbn localhost:8080/holds
          expect 201 -- -X POST -d member=eve -d isbn=$isbn localhost:8080/holds
          [ "$(queue $isbn)" = "dee,eve," ] || { echo "::error::queue order: $(queue $isbn)"; exit 1; }
          for b in B1 B2 B3; do curl -sf -X POST -d member=fay -d isbn=$b localhost:8080/loans >/dev/null; done
          for b in B4 B5; do curl -sf -X POST -d member=gus -d isbn=$b localhost:8080/loans >/dev/null; done
          for b in B1 B2 B3 B4; do expect 201 -- -X POST -d member=hal -d isbn=$b localhost:8080/holds; done   # 4: the off-by-one
          expect 409 'hold limit reached' -- -X POST -d member=hal -d isbn=B5 localhost:8080/holds
          expect 200 -- -X POST localhost:8080/holds/H2/cancel
          expect 409 'hold already cancelled' -- -X POST localhost:8080/holds/H2/cancel
          expect 404 'no such hold' -- -X POST localhost:8080/holds/H99/cancel
          [ "$(queue $isbn)" = "eve," ] || { echo "::error::queue after cancel: $(queue $isbn)"; exit 1; }
          echo "legacy holds behave as designed"
      - name: legacy-billing can't be built (vendor client is private)
        working-directory: synthetic/legacy-billing
        run: |
          if mvn -q -B package > /tmp/billing.log 2>&1; then
            echo "::error::legacy-billing built; it must fail on the vendor client"; exit 1
          fi
          grep -q "vault-client" /tmp/billing.log || { cat /tmp/billing.log; echo "::error::failed for another reason"; exit 1; }
      - name: legacy-billing's arithmetic compiles and tests pass from source alone
        working-directory: synthetic/legacy-billing
        run: |
          mvn -q -B dependency:get -Dartifact=junit:junit:4.13.2
          M=~/.m2/repository
          CP="$M/junit/junit/4.13.2/junit-4.13.2.jar:$M/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar"
          javac -d /tmp/out -cp "$CP" -sourcepath src/main/java -implicit:class src/test/java/billing/*Test.java
          java -cp "/tmp/out:$CP" org.junit.runner.JUnitCore billing.InvoiceCalculatorTest
